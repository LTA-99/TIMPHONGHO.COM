<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TÌM PHÒNG HỘ · Cho thuê phòng</title>
    <meta
      name="description"
      content="Trang liên hệ nhanh cho dịch vụ cho thuê phòng cao cấp tại Hà Nội."
    />
    <meta property="og:title" content="TÌM PHÒNG HỘ · Cho thuê phòng" />
    <meta
      property="og:description"
      content="Xem phòng, nhắn tin và gọi nhanh để được tư vấn phòng phù hợp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timphongho.com" />
    <meta name="theme-color" content="#f0f0f0" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="profile-card" aria-labelledby="profile-title">
        <div class="profile-head">
          <div class="avatar-row">
            <div class="avatar" data-avatar>
              <span data-initials>TPH</span>
            </div>
          </div>

          <div class="profile-summary">
            <div class="name-row">
              <h1 id="profile-title" data-name>TÌM PHÒNG HỘ</h1>
              <span class="verified" aria-label="Đã xác thực" data-check-icon></span>
            </div>

            <p class="follow-line">
              <strong data-room-count>12</strong> phòng đang cho thuê
              <span>·</span>
              <strong data-satisfaction>98%</strong> khách hài lòng
            </p>
          </div>
        </div>
      </section>

      <section class="content-card">
        <nav class="tabs" aria-label="Nội dung hồ sơ">
          <button class="tab active" type="button" data-tab-button="contact">Liên hệ</button>
          <button class="tab" type="button" data-tab-button="about">Giới thiệu</button>
        </nav>

        <section class="tab-content show" id="tab-contact" data-tab-panel="contact" aria-label="Liên hệ">
          <div data-contact-links></div>
        </section>

        <section class="tab-content" id="tab-about" data-tab-panel="about" aria-label="Giới thiệu">
          <div class="intro-block" data-about></div>
        </section>
      </section>
    </main>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
