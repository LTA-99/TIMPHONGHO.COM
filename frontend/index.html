<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nguyễn Văn A · Cho thuê phòng</title>
    <meta
      name="description"
      content="Trang liên hệ nhanh cho dịch vụ cho thuê phòng cao cấp tại Hà Nội."
    />
    <meta property="og:title" content="Nguyễn Văn A · Cho thuê phòng" />
    <meta
      property="og:description"
      content="Xem phòng, nhắn tin và gọi nhanh để được tư vấn phòng phù hợp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timphongho.com" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="hero-card" aria-labelledby="profile-title">
        <div class="avatar" data-initials>NA</div>
        <div class="hero-info">
          <h1 id="profile-title" data-name>Nguyễn Văn A</h1>
          <p>
            <span data-title>Cho thuê phòng cao cấp tại Hà Nội</span>
            <span class="dot">·</span>
            <span data-subtitle>Uy tín 5 năm</span>
          </p>
          <div class="tag-row" data-tags></div>
        </div>
      </section>

      <p class="section-label" data-section-label>Kết nối</p>
      <section class="links-col" data-links aria-label="Kết nối"></section>

      <section class="cta-block" aria-label="Liên hệ ngay">
        <div>
          <p data-contact-label>Liên hệ ngay</p>
          <strong data-phone>0912.345.678</strong>
        </div>
        <a class="cta-btn" href="tel:0912345678" data-phone-link>
          <span class="cta-icon" data-phone-icon></span>
          <span data-cta-label>Gọi ngay</span>
        </a>
      </section>

      <footer class="footer-line">
        <span data-footer-left>Cho thuê phòng</span>
        <span data-footer-right>Hỗ trợ 7/7</span>
      </footer>
    </main>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
